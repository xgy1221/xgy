server:
  port: 8080

spring:
  application:
    name: xueguan-yun
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/xgy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: xgy
    password: xgy123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3s

app:
  jwt:
    secret: xgy-cloud-jwt-secret-key-change-me-in-production-must-be-long-enough-256bits-minimum-for-hs256
    expire-days: 7
  sms:
    demo-code: "123456"

logging:
  level:
    com.xgy.cloud: INFO
    org.springframework.security: WARN
