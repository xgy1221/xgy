# tvOS builds require macOS runners — Linux cannot compile tvOS.
# No Apple secrets yet: simulator build still runs; archive job prints next steps and exits.
name: tvOS Build

on:
  push:
    branches: [master, "cursor/**"]
    paths:
      - "LeiShiKaraoke/**"
      - ".github/workflows/tvos-build.yml"
  pull_request:
    paths:
      - "LeiShiKaraoke/**"
      - ".github/workflows/tvos-build.yml"
  workflow_dispatch:

env:
  PROJECT_PATH: LeiShiKaraoke/LeiShiKaraoke.xcodeproj
  SCHEME: LeiShiKaraoke
  DEST_SIM: platform=tvOS Simulator,name=Apple TV

jobs:
  build-simulator:
    name: Simulator build (no Mac needed for you)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -list -project "$PROJECT_PATH"
      - name: Build (unsigned, simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -destination "$DEST_SIM" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

  signing-gate:
    name: Signing / TestFlight gate
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets & print next steps
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          missing=()
          [ -z "$APPLE_TEAM_ID" ] && missing+=("APPLE_TEAM_ID")
          [ -z "$APPLE_CERTIFICATE_BASE64" ] && missing+=("APPLE_CERTIFICATE_BASE64")
          [ -z "$APPLE_CERTIFICATE_PASSWORD" ] && missing+=("APPLE_CERTIFICATE_PASSWORD")
          [ -z "$APPLE_PROVISION_PROFILE_BASE64" ] && missing+=("APPLE_PROVISION_PROFILE_BASE64")
          echo "============================================"
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Signing secrets not configured."
            echo "Missing: ${missing[*]}"
            echo ""
            echo "You do NOT need to buy a Mac."
            echo "Next steps:"
            echo "  1. Join Apple Developer Program"
            echo "  2. Send us your Team ID"
            echo "  3. We wire GitHub Secrets + App Store Connect"
            echo "  4. Archive job uploads to TestFlight → install on Apple TV"
            echo "Docs: docs/install-apple-tv.md (project store)"
            echo "============================================"
            exit 1
          fi
          echo "All signing secrets present. Archive job can run on macOS."
          echo "============================================"

  archive:
    name: Archive (when secrets exist)
    needs: [build-simulator, signing-gate]
    if: ${{ secrets.APPLE_TEAM_ID != '' && secrets.APPLE_CERTIFICATE_BASE64 != '' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Import cert & profile
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo -n "$APPLE_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "temporary" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "temporary" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=tvOS" \
            -archivePath build/LeiShiKaraoke.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: LeiShiKaraoke-xcarchive
          path: build/LeiShiKaraoke.xcarchive
